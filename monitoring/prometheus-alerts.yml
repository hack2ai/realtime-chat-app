groups:
  - name: chatapp-runtime
    interval: 30s
    rules:
      - alert: ChatAppProtocolErrorsHigh
        expr: increase(chatapp_protocol_errors_total[5m]) > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ChatApp is seeing elevated protocol errors"
          description: "More than 25 protocol errors were observed in the last 5 minutes."

      - alert: ChatAppRejectedConnectionsHigh
        expr: increase(chatapp_rejected_connections_total[5m]) > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ChatApp is rejecting many connections"
          description: "More than 25 connections were rejected in the last 5 minutes."

      - alert: ChatAppHandlerQueueBacklog
        expr: chatapp_handler_pool_queue_depth > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ChatApp handler queue is backed up"
          description: "The client-handler executor has maintained a queue depth above 50 for 5 minutes."

      - alert: ChatAppJvmMemoryPressure
        expr: chatapp_jvm_memory_max_bytes > 0 and (chatapp_jvm_memory_used_bytes / chatapp_jvm_memory_max_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ChatApp JVM memory pressure is high"
          description: "JVM heap usage has remained above 85% of the configured maximum for 5 minutes."

      - alert: ChatAppNoActiveConnections
        expr: chatapp_connected_users == 0 and chatapp_jvm_uptime_seconds > 900
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "ChatApp has no connected users"
          description: "The server has been up for more than 15 minutes with no authenticated users connected."
