global:
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: chatapp-server
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /run/secrets/metrics_auth_token
    static_configs:
      - targets:
          - server:9100
        labels:
          service: chatapp-server
