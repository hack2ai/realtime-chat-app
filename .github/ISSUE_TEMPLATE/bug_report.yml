name: Bug report
description: Report a reproducible problem in the chat application.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence of steps that reproduces the problem.
      placeholder: |
        1. Start the server with ...
        2. Connect a client ...
        3. Send ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime environment
      placeholder: JDK 21, Windows 11, Docker Compose
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, session tokens, credentials, private keys, and other sensitive data before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed sensitive information from logs and examples.
          required: true
