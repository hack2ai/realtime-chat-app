name: Bug report
description: Report a reproducible problem in the chat application.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not post passwords, session tokens, database credentials, private keys, private messages, or other sensitive data.

        For suspected security vulnerabilities, follow [SECURITY.md](../../SECURITY.md) instead of opening a public issue.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start the server with ...
        2. Connect a client ...
        3. Send ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release tag or Git commit SHA tested.
      placeholder: 1.1.0 or 40-character commit SHA
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime environment
      description: Include OS, JDK version, and deployment mode where relevant.
      placeholder: JDK 21, Windows 11, Docker Compose
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, session tokens, credentials, private keys, private messages, and other sensitive data before posting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed sensitive information from logs and examples.
          required: true
        - label: This is not a security vulnerability report; I will follow SECURITY.md for security issues.
          required: true
