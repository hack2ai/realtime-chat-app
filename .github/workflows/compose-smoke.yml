name: Docker Compose Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
      CHATAPP_DB_PASSWORD: ci-app-password

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start Compose stack
        run: docker compose up --build --pull always -d

      - name: Wait for healthy services
        run: |
          for attempt in {1..30}; do
            db_container=$(docker compose ps -q db)
            server_container=$(docker compose ps -q server)

            db_health=$(docker inspect --format '{{.State.Health.Status}}' "$db_container" 2>/dev/null || true)
            server_health=$(docker inspect --format '{{.State.Health.Status}}' "$server_container" 2>/dev/null || true)

            echo "Attempt ${attempt}/30: db=${db_health:-unknown}, server=${server_health:-unknown}"

            if [ "$db_health" = "healthy" ] && [ "$server_health" = "healthy" ]; then
              exit 0
            fi

            sleep 5
          done

          docker compose ps
          docker compose logs --no-color db server
          exit 1

      - name: Verify TCP listener
        run: |
          timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5050'

      - name: Stop Compose stack
        if: always()
        run: docker compose down
