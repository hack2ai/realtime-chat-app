name: Configuration Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configuration-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate secure defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Verify secure development defaults
        run: |
          config=src/main/resources/config.properties.example
          grep -Fqx 'db.useSsl=true' "$config"
          grep -Fqx 'db.allowPublicKeyRetrieval=false' "$config"
          grep -Fqx 'server.bindAddress=127.0.0.1' "$config"
          grep -Fqx 'server.allowPlaintextRemote=false' "$config"
          grep -Fqx 'metrics.enabled=false' "$config"
          grep -Fqx 'metrics.bindAddress=127.0.0.1' "$config"
          grep -Fqx 'metrics.allowRemote=false' "$config"
          grep -Fqx 'tls.enabled=false' "$config"
          grep -Fqx 'client.tls.enabled=false' "$config"

      - name: Verify secret placeholders remain non-operational
        run: |
          config=src/main/resources/config.properties.example
          grep -Fqx 'db.password=' "$config"
          grep -Fqx 'metrics.authToken=' "$config"
          grep -Fqx 'tls.keyStorePassword=CHANGE_ME' "$config"
          grep -Fqx 'client.tls.trustStorePassword=' "$config"
