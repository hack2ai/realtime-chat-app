name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate server checksum
        run: sha256sum target/chatapp-server.jar > target/chatapp-server.jar.sha256

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-server-${{ github.sha }}
          path: |
            target/chatapp-server.jar
            target/chatapp-server.jar.sha256
          if-no-files-found: error
          retention-days: 14
