name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify runnable server package
        run: |
          test -s target/chatapp-server.jar
          unzip -p target/chatapp-server.jar META-INF/MANIFEST.MF | grep -Eq '^Main-Class: com\.chatapp\.server\.ChatServer[[:space:]]*$'

      - name: Generate and verify server checksum
        run: |
          sha256sum target/chatapp-server.jar > target/chatapp-server.jar.sha256
          sha256sum --check target/chatapp-server.jar.sha256

      - name: Upload server package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chatapp-server-${{ github.sha }}
          path: |
            target/chatapp-server.jar
            target/chatapp-server.jar.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Validate Docker Compose configuration
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose config --quiet

      - name: Verify Compose server hardening
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: |
          docker compose config --format json > /tmp/chatapp-compose.json
          test "$(jq -r '.services.server.read_only' /tmp/chatapp-compose.json)" = "true"
          test "$(jq -r '.services.server.init' /tmp/chatapp-compose.json)" = "true"
          test "$(jq -r '.services.server.security_opt[0]' /tmp/chatapp-compose.json)" = "no-new-privileges:true"
          test "$(jq -r '.services.server.cap_drop | join(\",\")' /tmp/chatapp-compose.json)" = "ALL"
          test "$(jq -r '.services.server.pids_limit' /tmp/chatapp-compose.json)" = "256"
          test "$(jq -r '.services.server.ulimits.nofile.soft' /tmp/chatapp-compose.json)" = "4096"
          test "$(jq -r '.services.server.ulimits.nofile.hard' /tmp/chatapp-compose.json)" = "8192"
          test "$(jq -r '.services.server.logging.driver' /tmp/chatapp-compose.json)" = "json-file"
          test "$(jq -r '.services.server.logging.options[\"max-size\"]' /tmp/chatapp-compose.json)" = "10m"
          test "$(jq -r '.services.server.logging.options[\"max-file\"]' /tmp/chatapp-compose.json)" = "3"
          test "$(jq -r '.services.db.logging.driver' /tmp/chatapp-compose.json)" = "json-file"
          test "$(jq -r '.services.db.logging.options[\"max-size\"]' /tmp/chatapp-compose.json)" = "10m"
          test "$(jq -r '.services.db.logging.options[\"max-file\"]' /tmp/chatapp-compose.json)" = "3"
          test "$(jq -r '.networks.backend.internal' /tmp/chatapp-compose.json)" = "true"
          test "$(jq -r '(.services.db.ports // []) | length' /tmp/chatapp-compose.json)" = "0"

      - name: Build server container image
        run: docker build --pull --tag realtime-chat-app:${{ github.sha }} .

      - name: Verify server image runs as non-root
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{.Config.User}}')" = "chatapp"

      - name: Verify server image entrypoint
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{json .Config.Entrypoint}}')" = '[\"java\",\"-jar\",\"/app/chatapp-server.jar\"]'

      - name: Verify server image port
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{json .Config.ExposedPorts}}')" = '{\"5050/tcp\":{}}'

      - name: Verify attachment directory permissions
        run: |
          docker run --rm --entrypoint sh realtime-chat-app:${{ github.sha }} -c 'test "$(id -u)" = "10001" && test -w /app/data/attachments && ! test -w /app/chatapp-server.jar'
