name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify workflow action pinning
        run: |
          violations=$(grep -RhoE 'uses:[[:space:]]+[^@[:space:]]+@[^[:space:]#]+' .github/workflows | awk -F@ '$2 !~ /^[0-9a-fA-F]{40}$/')
          test -z "$violations"

      - name: Verify Docker build context exclusions
        run: |
          for pattern in '.git' '.github' 'target' '/data' '**/config.properties' '**/.env' '**/.env.*' '**/secrets/**' '**/*.p12' '**/*.pfx' '**/*.jks' '**/*.keystore' '**/*.pem' '**/*.key' '**/*.crt'; do
            grep -Fxq "$pattern" .dockerignore
          done

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify runnable server package
        run: |
          test -s target/chatapp-server.jar
          unzip -p target/chatapp-server.jar META-INF/MANIFEST.MF | grep -Eq '^Main-Class: com\.chatapp\.server\.ChatServer[[:space:]]*$'

      - name: Read project version
        run: echo "PROJECT_VERSION=$(mvn --batch-mode --no-transfer-progress -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_ENV"

      - name: Generate software bill of materials
        run: |
          mvn --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=chatapp-sbom
          test -s target/chatapp-sbom.json

      - name: Generate and verify server checksum
        run: |
          sha256sum target/chatapp-server.jar > target/chatapp-server.jar.sha256
          sha256sum --check target/chatapp-server.jar.sha256

      - name: Upload server package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chatapp-server-${{ github.sha }}
          path: |
            target/chatapp-server.jar
            target/chatapp-server.jar.sha256
            target/chatapp-sbom.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate Docker Compose configuration
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose config --quiet

      - name: Verify Compose server hardening
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: |
          docker compose config --format json > /tmp/chatapp-compose.json
          test "$(jq -r '.services.db.cpus' /tmp/chatapp-compose.json)" = "2"
          test "$(jq -r '.services.db.mem_limit' /tmp/chatapp-compose.json)" = "1073741824"
          test "$(jq -r '.services.db.pids_limit' /tmp/chatapp-compose.json)" = "512"
          test "$(jq -r '.services.db.stop_grace_period' /tmp/chatapp-compose.json)" = "30s"
          test "$(jq -r '.services.db.ulimits.nofile.soft' /tmp/chatapp-compose.json)" = "4096"
          test "$(jq -r '.services.db.ulimits.nofile.hard' /tmp/chatapp-compose.json)" = "8192"
          test "$(jq -r '.services.server.cpus' /tmp/chatapp-compose.json)" = "1"
          test "$(jq -r '.services.server.mem_limit' /tmp/chatapp-compose.json)" = "805306368"
          test "$(jq -r '.services.server.read_only' /tmp/chatapp-compose.json)" = "true"
          test "$(jq -r '.services.server.init' /tmp/chatapp-compose.json)" = "true"
          test "$(jq -r '.services.server.security_opt[0]' /tmp/chatapp-compose.json)" = "no-new-privileges:true"
          test "$(jq -r '.services.db.security_opt[0]' /tmp/chatapp-compose.json)" = "no-new-privileges:true"
          test "$(jq -r '.services.server.cap_drop | join(\",\")' /tmp/chatapp-compose.json)" = "ALL"
          test "$(jq -r '.services.server.pids_limit' /tmp/chatapp-compose.json)" = "256"
          test "$(jq -r '.services.server.ulimits.nofile.soft' /tmp/chatapp-compose.json)" = "4096"
          test "$(jq -r '.services.server.ulimits.nofile.hard' /tmp/chatapp-compose.json)" = "8192"
          test "$(jq -r '.services.server.logging.driver' /tmp/chatapp-compose.json)" = "json-file"
          test "$(jq -r '.services.server.logging.options[\"max-size\"]' /tmp/chatapp-compose.json)" = "10m"
          test "$(jq -r '.services.server.logging.options[\"max-file\"]' /tmp/chatapp-compose.json)" = "3"
          test "$(jq -r '.services.db.logging.driver' /tmp/chatapp-compose.json)" = "json-file"
          test "$(jq -r '.services.db.logging.options[\"max-size\"]' /tmp/chatapp-compose.json)" = "10m"
          test "$(jq -r '.services.db.logging.options[\"max-file\"]' /tmp/chatapp-compose.json)" = "3"
          test "$(jq -r '.networks.backend.internal' /tmp/chatapp-compose.json)" = "true"
          test "$(jq -r '(.services.db.ports // []) | length' /tmp/chatapp-compose.json)" = "0"
          test "$(jq -r '(.services.server.ports // []) | length' /tmp/chatapp-compose.json)" = "1"
          test "$(jq -r '.services.server.ports[0].target' /tmp/chatapp-compose.json)" = "5050"
          test "$(jq -r '.services.server.ports[0].published' /tmp/chatapp-compose.json)" = "5050"
          test "$(jq -r '.services.server.depends_on.db.condition' /tmp/chatapp-compose.json)" = "service_healthy"
          test "$(jq -r '.services.server.volumes[0].target' /tmp/chatapp-compose.json)" = "/app/data/attachments"
          test "$(jq -r '.services.server.tmpfs[0]' /tmp/chatapp-compose.json)" = "/tmp:rw,noexec,nosuid,size=64m"

      - name: Build server container image
        run: docker build --pull --build-arg APP_VERSION="$PROJECT_VERSION" --build-arg VCS_REF="${{ github.sha }}" --tag realtime-chat-app:${{ github.sha }} .

      - name: Verify server image metadata
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{index .Config.Labels \"org.opencontainers.image.source\"}}')" = "https://github.com/hack2ai/realtime-chat-app"
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{index .Config.Labels \"org.opencontainers.image.description\"}}')" = "Secure Java 21 real-time chat server"
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{index .Config.Labels \"org.opencontainers.image.licenses\"}}')" = "MIT"
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{index .Config.Labels \"org.opencontainers.image.version\"}}')" = "$PROJECT_VERSION"
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}')" = "${{ github.sha }}"

      - name: Verify server image runs as non-root
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{.Config.User}}')" = "chatapp"

      - name: Verify server image entrypoint
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{json .Config.Entrypoint}}')" = '[\"java\",\"-XX:+ExitOnOutOfMemoryError\",\"-jar\",\"/app/chatapp-server.jar\"]'

      - name: Verify server image port
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{json .Config.ExposedPorts}}')" = '{\"5050/tcp\":{}}'

      - name: Verify server image healthcheck
        run: |
          test "$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}')" = '[\"CMD-SHELL\",\"test -f /tmp/chatapp.ready || exit 1\"]'

      - name: Verify server image contains no application secrets
        run: |
          image_env=$(docker image inspect realtime-chat-app:${{ github.sha }} --format '{{json .Config.Env}}')
          if printf '%s' "$image_env" | grep -Eq 'CHATAPP_(DB_PASSWORD|MYSQL_ROOT_PASSWORD|AUTH_.*(PASSWORD|SECRET|TOKEN))'; then
            echo "application secret-like environment variable found in image metadata"
            exit 1
          fi

      - name: Verify attachment directory permissions
        run: |
          docker run --rm --entrypoint sh realtime-chat-app:${{ github.sha }} -c 'test "$(id -u)" = "10001" && test -w /app/data/attachments && ! test -w /app/chatapp-server.jar'

      - name: Verify server image contains no setuid/setgid executables
        run: |
          docker run --rm --entrypoint sh realtime-chat-app:${{ github.sha }} -c 'test -z "$(find / -xdev -type f -perm /6000 -print 2>/dev/null)"'

      - name: Verify server image Java runtime
        run: docker run --rm --entrypoint java realtime-chat-app:${{ github.sha }} -version

      - name: Smoke test Compose deployment
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: |
          set -e
          cleanup() {
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            db_status=$(docker compose ps -q db | xargs -r docker inspect -f '{{.State.Health.Status}}' 2>/dev/null || true)
            server_status=$(docker compose ps -q server | xargs -r docker inspect -f '{{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$db_status" = "healthy" ] && [ "$server_status" = "healthy" ]; then
              touch_marker="/app/data/attachments/.ci-write-test"
              docker compose exec -T server sh -c "touch '$touch_marker' && rm -f '$touch_marker'"
              ! docker compose exec -T server sh -c 'touch /app/.ci-read-only-test'
              timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5050'
              python3 - <<'PY'
import json
import socket
import struct

request = json.dumps({"type": "PING", "payload": {}, "timestamp": 0}).encode("utf-8")
with socket.create_connection(("127.0.0.1", 5050), timeout=5) as sock:
    sock.sendall(struct.pack(">I", len(request)) + request)
    header = sock.recv(4)
    if len(header) != 4:
        raise SystemExit("server returned an incomplete frame header")
    length = struct.unpack(">I", header)[0]
    response = b""
    while len(response) < length:
        chunk = sock.recv(length - len(response))
        if not chunk:
            raise SystemExit("server closed the connection before the response was complete")
        response += chunk

message = json.loads(response.decode("utf-8"))
if message.get("type") != "PONG":
    raise SystemExit(f"expected PONG, received {message.get('type')!r}")
PY
              exit 0
            fi
            docker compose ps
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color db server
          exit 1

  attest:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download server package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chatapp-server-${{ github.sha }}
          path: dist

      - name: Attest server build artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/target/chatapp-server.jar
