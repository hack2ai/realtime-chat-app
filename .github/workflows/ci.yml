name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate server checksum
        run: sha256sum target/chatapp-server.jar > target/chatapp-server.jar.sha256

      - name: Upload server package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chatapp-server-${{ github.sha }}
          path: |
            target/chatapp-server.jar
            target/chatapp-server.jar.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Validate Docker Compose configuration
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose config --quiet

      - name: Build server container image
        run: docker build --pull --tag realtime-chat-app:${{ github.sha }} .
