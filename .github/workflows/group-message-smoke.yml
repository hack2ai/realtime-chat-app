name: Group Message Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group-message-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  group-message-smoke:
    name: End-to-end group messaging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Start Docker Compose stack
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose up -d --build

      - name: Wait for Docker Compose health
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: |
          for attempt in {1..24}; do
            statuses=$(docker compose ps --format json)
            db_status=$(printf '%s\n' "$statuses" | jq -r 'select(.Service == "db") | .Health // "unknown"')
            server_status=$(printf '%s\n' "$statuses" | jq -r 'select(.Service == "server") | .Health // "unknown"')
            if [ "$db_status" = "healthy" ] && [ "$server_status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color server db
          exit 1

      - name: Smoke test authenticated group creation, membership, delivery, and history
        env:
          CHATAPP_CI_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import socket
          import struct
          import time

          HOST = "127.0.0.1"
          PORT = 5050
          RUN_ID = os.environ["CHATAPP_CI_RUN_ID"]
          PASSWORD = "CItest1234!"
          USER_A = f"ci_group_a_{RUN_ID}"
          USER_B = f"ci_group_b_{RUN_ID}"
          MESSAGE = f"group-message-smoke-{RUN_ID}"
          GROUP_NAME = f"ci-group-{RUN_ID}"

          def recv_frame(sock):
              header = b""
              while len(header) < 4:
                  chunk = sock.recv(4 - len(header))
                  if not chunk:
                      raise SystemExit("server closed the connection before the response header was complete")
                  header += chunk
              length = struct.unpack(">i", header)[0]
              if length <= 0 or length > 8 * 1024 * 1024:
                  raise SystemExit(f"invalid response frame length: {length}")
              payload = b""
              while len(payload) < length:
                  chunk = sock.recv(length - len(payload))
                  if not chunk:
                      raise SystemExit("server closed the connection before the response was complete")
                  payload += chunk
              return json.loads(payload.decode("utf-8"))

          def send(sock, message_type, payload):
              encoded = json.dumps({
                  "type": message_type,
                  "payload": payload,
                  "timestamp": int(time.time() * 1000),
              }, separators=(",", ":")).encode("utf-8")
              sock.sendall(struct.pack(">i", len(encoded)) + encoded)

          def recv_until(sock, expected_type, label, timeout=5):
              deadline = time.time() + timeout
              while time.time() < deadline:
                  response = recv_frame(sock)
                  if response.get("type") == expected_type:
                      return response
              raise SystemExit(f"timed out waiting for {expected_type} during {label}")

          def register_and_login(sock, username):
              send(sock, "C2S_REGISTER", {
                  "username": username,
                  "email": f"{username}@example.com",
                  "password": PASSWORD,
                  "confirmPassword": PASSWORD,
              })
              registration = recv_until(sock, "S2C_REGISTER_SUCCESS", f"registration of {username}")
              user_id = (registration.get("payload") or {}).get("userId")
              if not isinstance(user_id, int) or user_id <= 0:
                  raise SystemExit(f"registration response missing userId: {registration!r}")

              send(sock, "C2S_LOGIN", {
                  "usernameOrEmail": username,
                  "password": PASSWORD,
              })
              login = recv_until(sock, "S2C_LOGIN_SUCCESS", f"login of {username}")
              login_payload = login.get("payload") or {}
              if login_payload.get("username") != username or not login_payload.get("sessionToken"):
                  raise SystemExit(f"login response missing expected identity/session token: {login!r}")
              return user_id

          with socket.create_connection((HOST, PORT), timeout=5) as sock_a, socket.create_connection((HOST, PORT), timeout=5) as sock_b:
              sock_a.settimeout(5)
              sock_b.settimeout(5)

              user_a_id = register_and_login(sock_a, USER_A)
              user_b_id = register_and_login(sock_b, USER_B)

              send(sock_a, "C2S_CREATE_GROUP", {"name": GROUP_NAME})
              created = recv_until(sock_a, "S2C_GROUP_CREATED", "group creation")
              group = (created.get("payload") or {}).get("group") or {}
              group_id = group.get("groupId")
              if not isinstance(group_id, int) or group_id <= 0:
                  raise SystemExit(f"group creation response missing groupId: {created!r}")
              if group.get("name") != GROUP_NAME or group.get("ownerId") != user_a_id:
                  raise SystemExit(f"group creation response has unexpected identity: {created!r}")

              send(sock_b, "C2S_JOIN_GROUP", {"groupId": group_id})
              joined = recv_until(sock_b, "S2C_GROUP_LIST", "group join")
              groups = (joined.get("payload") or {}).get("groups") or []
              joined_group = next((item for item in groups if item.get("groupId") == group_id), None)
              if joined_group is None or joined_group.get("memberCount") < 2:
                  raise SystemExit(f"group membership was not updated after join: {joined!r}")

              send(sock_a, "C2S_GROUP_MESSAGE", {
                  "groupId": group_id,
                  "message": MESSAGE,
              })

              sender_event = recv_until(sock_a, "S2C_GROUP_MESSAGE", "sender group message echo")
              sender_payload = sender_event.get("payload") or {}
              if sender_payload.get("groupId") != group_id or sender_payload.get("senderId") != user_a_id:
                  raise SystemExit(f"sender group event has unexpected metadata: {sender_event!r}")
              if sender_payload.get("message") != MESSAGE:
                  raise SystemExit(f"sender group event content mismatch: {sender_event!r}")

              recipient_event = recv_until(sock_b, "S2C_GROUP_MESSAGE", "recipient group message")
              recipient_payload = recipient_event.get("payload") or {}
              if recipient_payload.get("groupId") != group_id or recipient_payload.get("senderId") != user_a_id:
                  raise SystemExit(f"recipient group event has unexpected metadata: {recipient_event!r}")
              if recipient_payload.get("message") != MESSAGE:
                  raise SystemExit(f"recipient group event content mismatch: {recipient_event!r}")

              send(sock_b, "C2S_REQUEST_GROUP_HISTORY", {
                  "groupId": group_id,
                  "limit": 10,
                  "beforeMessageId": 0,
              })
              history = recv_until(sock_b, "S2C_GROUP_HISTORY", "group message history")
              history_payload = history.get("payload") or {}
              messages = history_payload.get("messages") or []
              if not any(
                  message.get("groupId") == group_id
                  and message.get("senderId") == user_a_id
                  and message.get("message") == MESSAGE
                  for message in messages
              ):
                  raise SystemExit(f"group message was not persisted in history: {history!r}")
          PY

      - name: Show service logs on failure
        if: failure()
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose logs --no-color server db

      - name: Cleanup Docker Compose resources
        if: always()
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose down --volumes --remove-orphans
