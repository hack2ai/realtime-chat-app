name: Container Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-policy:
    name: Check container base images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject mutable latest base images
        run: |
          if grep -nE '^\s*FROM\s+[^[:space:]]+:latest([[:space:]]|$)' Dockerfile; then
            echo 'Docker base images must not use the mutable :latest tag.'
            exit 1
          fi
