name: Workflow Syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-syntax-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow definitions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse workflow YAML
        run: |
          set -eu
          ruby -e '
            require "yaml"
            Dir[".github/workflows/*.yml", ".github/workflows/*.yaml"].sort.each do |path|
              YAML.load_file(path, aliases: true)
              puts "Validated #{path}"
            end
          '

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi
