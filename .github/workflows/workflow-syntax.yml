name: Workflow Syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-syntax-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow definitions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse workflow YAML
        run: |
          set -eu
          ruby -e '
            require "yaml"
            Dir[".github/workflows/*.yml", ".github/workflows/*.yaml"].sort.each do |path|
              YAML.load_file(path, aliases: true)
              puts "Validated #{path}"
            end
          '

      - name: Verify explicit workflow permissions
        run: |
          set -eu
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.yml", ".github/workflows/*.yaml"].sort
            missing = paths.select do |path|
              workflow = YAML.load_file(path, aliases: true)
              !workflow.key?("permissions")
            end
            abort "Workflows missing explicit top-level permissions: #{missing.join(", ")}" unless missing.empty?
            puts "All workflows declare explicit top-level permissions."
          '

      - name: Verify workflow concurrency and job timeouts
        run: |
          set -eu
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.yml", ".github/workflows/*.yaml"].sort
            paths.each do |path|
              workflow = YAML.load_file(path, aliases: true)
              abort "Workflow #{path} must declare top-level concurrency." unless workflow.key?("concurrency")
              jobs = workflow["jobs"] || {}
              abort "Workflow #{path} must define at least one job." if jobs.empty?
              jobs.each do |job_name, job|
                timeout = job.is_a?(Hash) ? job["timeout-minutes"] : nil
                unless timeout.is_a?(Integer) && timeout.positive?
                  abort "Job #{job_name} in #{path} must declare a positive timeout-minutes value."
                end
                if timeout > 30
                  abort "Job #{job_name} in #{path} exceeds the 30-minute timeout ceiling."
                end
              end
            end
            puts "All workflows declare concurrency and job timeouts between 1 and 30 minutes."
          '

      - name: Verify safe checkout configuration
        run: |
          set -eu
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.yml", ".github/workflows/*.yaml"].sort
            paths.each do |path|
              workflow = YAML.load_file(path, aliases: true)
              (workflow["jobs"] || {}).each do |job_name, job|
                steps = job.is_a?(Hash) ? job["steps"] : nil
                next unless steps.is_a?(Array)
                steps.each do |step|
                  next unless step.is_a?(Hash) && step["uses"].is_a?(String)
                  next unless step["uses"].start_with?("actions/checkout@")
                  with = step["with"]
                  unless with.is_a?(Hash) && with["persist-credentials"] == false
                    abort "Checkout step in #{job_name} within #{path} must set persist-credentials: false."
                  end
                end
              end
            end
            puts "All actions/checkout steps disable credential persistence."
          '

      - name: Verify safe workflow triggers and permissions
        run: |
          set -eu
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.yml", ".github/workflows/*.yaml"].sort
            paths.each do |path|
              workflow = YAML.load_file(path, aliases: true)
              if workflow.key?("pull_request_target")
                abort "Unsafe trigger pull_request_target is forbidden in #{path}."
              end
              top_permissions = workflow["permissions"]
              if top_permissions == "write-all" || top_permissions == { "write-all" => true }
                abort "Broad write-all permissions are forbidden in #{path}."
              end
              if top_permissions.is_a?(Hash) && top_permissions["contents"] == "write" && path != ".github/workflows/release.yml"
                abort "contents: write is reserved for the release workflow: #{path}"
              end
              (workflow["jobs"] || {}).each do |job_name, job|
                next unless job.is_a?(Hash)
                job_permissions = job["permissions"]
                if job_permissions == "write-all" || job_permissions == { "write-all" => true }
                  abort "Broad write-all job permissions are forbidden in #{job_name} within #{path}."
                end
                if job_permissions.is_a?(Hash) && job_permissions["contents"] == "write" && path != ".github/workflows/release.yml"
                  abort "contents: write at job level is reserved for the release workflow: #{job_name} in #{path}."
                end
              end
            end
            puts "Workflow triggers and top-level/job-level permissions satisfy the security policy."
          '

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi
