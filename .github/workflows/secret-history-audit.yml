name: Secret History Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit repository history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Audit history for sensitive filenames
        run: |
          forbidden=$(git log --all --name-only --format= | sed '/^$/d' | sort -u | grep -E '(^|/)(\.env|config\.properties|[^/]+\.(p12|pfx|jks|key|pem))$' | grep -v '^src/test/resources/config\.properties$' || true)
          if [ -n "$forbidden" ]; then
            echo 'Sensitive configuration or key material has appeared in repository history:'
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Audit history for tracked build outputs
        run: |
          forbidden=$(git log --all --name-only --format= | sed '/^$/d' | sort -u | grep -E '(^|/)(target/|[^/]+\.(class|jar|war))' || true)
          if [ -n "$forbidden" ]; then
            echo 'Build outputs have appeared in repository history:'
            printf '%s\n' "$forbidden"
            exit 1
          fi
