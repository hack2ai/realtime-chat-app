name: SQL Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sql-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-guard:
    name: Reject unsafe SQL patterns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify raw JDBC APIs remain absent
        run: |
          set -eu
          if git grep -nE 'java\.sql\.(Statement|CallableStatement)|import[[:space:]]+java\.sql\.(Statement|CallableStatement)[[:space:]]*;|\.createStatement\(|\.prepareCall\(' -- 'src/main/java'; then
            echo 'Raw JDBC statement APIs are forbidden; use PreparedStatement with parameter binding instead.'
            exit 1
          fi

      - name: Verify schema contains no destructive or privilege-changing SQL
        run: |
          set -eu
          if grep -nEi '(^|[[:space:];])(DROP|TRUNCATE)[[:space:]]+(DATABASE|TABLE|USER)|ALTER[[:space:]]+USER|GRANT[[:space:]]|REVOKE[[:space:]]|SET[[:space:]]+PASSWORD' src/main/resources/sql/schema.sql; then
            echo 'schema.sql must not contain destructive DDL or database privilege/password changes.'
            exit 1
          fi
