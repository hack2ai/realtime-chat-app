name: Docker Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Start Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start Compose stack
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose up -d --build

      - name: Wait for healthy services
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: |
          for attempt in $(seq 1 30); do
            db_container=$(docker compose ps -q db)
            server_container=$(docker compose ps -q server)

            if [ -n "$db_container" ] && [ -n "$server_container" ]; then
              db_status=$(docker inspect --format '{{.State.Health.Status}}' "$db_container")
              server_status=$(docker inspect --format '{{.State.Health.Status}}' "$server_container")

              echo "Attempt $attempt/30: db=$db_status server=$server_status"

              if [ "$db_status" = "healthy" ] && [ "$server_status" = "healthy" ]; then
                exit 0
              fi

              if [ "$db_status" = "unhealthy" ] || [ "$server_status" = "unhealthy" ]; then
                docker compose ps
                docker compose logs --no-color --tail=100
                exit 1
              fi
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color --tail=100
          exit 1

      - name: Show healthy stack
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose ps

      - name: Tear down Compose stack
        if: ${{ always() }}
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose down -v --remove-orphans
