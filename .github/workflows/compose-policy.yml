name: Compose Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose config --quiet

      - name: Verify server user policy
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: |
          config=$(docker compose config --format json)
          printf '%s\n' "$config" | jq -e '.services.server.user == "10001"' >/dev/null
