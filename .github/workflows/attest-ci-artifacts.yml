name: Attest CI Artifacts

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

concurrency:
  group: attest-ci-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  attest:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download server artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p artifacts/server artifacts/sbom
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "chatapp-server-$RUN_SHA" \
            --dir artifacts/server

      - name: Download SBOM artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "chatapp-sbom-$RUN_SHA" \
            --dir artifacts/sbom

      - name: Verify downloaded artifact checksums
        run: |
          test -s artifacts/server/chatapp-server.jar
          test -s artifacts/server/chatapp-server.jar.sha256
          test -s artifacts/sbom/bom.json
          test -s artifacts/sbom/bom.json.sha256
          (cd artifacts/server && sha256sum --check chatapp-server-${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA}.jar.sha256 2>/dev/null || true)
          sha256sum --check artifacts/server/chatapp-server.jar.sha256
          sha256sum --check artifacts/sbom/bom.json.sha256

      - name: Attest server artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/server/chatapp-server.jar

      - name: Attest SBOM artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/sbom/bom.json
