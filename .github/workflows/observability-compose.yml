name: Observability Compose

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.observability.yml'
      - '.github/workflows/observability-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.observability.yml'
      - '.github/workflows/observability-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Validate observability Compose overlay
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
          CHATAPP_METRICS_AUTH_TOKEN: ci-metrics-token
        run: |
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet

          config=$(docker compose -f docker-compose.yml -f docker-compose.observability.yml config --format json)
          printf '%s\n' "$config" | jq -e '.services.server.environment.CHATAPP_METRICS_ENABLED == "true"' >/dev/null
          printf '%s\n' "$config" | jq -e '.services.server.environment.CHATAPP_METRICS_BINDADDRESS == "0.0.0.0"' >/dev/null
          printf '%s\n' "$config" | jq -e '.services.server.environment.CHATAPP_METRICS_ALLOWREMOTE == "true"' >/dev/null
          printf '%s\n' "$config" | jq -e '.services.server.environment.CHATAPP_METRICS_AUTHTOKEN == "ci-metrics-token"' >/dev/null
          printf '%s\n' "$config" | jq -e '(.services.server.ports // []) | index("127.0.0.1:9100:9100") != null' >/dev/null

          if printf '%s\n' "$config" | jq -e '(.services.server.ports // []) | any(. == "9100:9100" or . == "0.0.0.0:9100:9100")' >/dev/null; then
            echo 'Metrics must not be published on all host interfaces.'
            exit 1
          fi
