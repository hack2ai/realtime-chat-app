name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify workflow action pinning
        run: |
          violations=$(grep -RhoE 'uses:[[:space:]]+[^@[:space:]]+@[^[:space:]#]+' .github/workflows | awk -F@ '$2 !~ /^[0-9a-fA-F]{40}$/')
          test -z "$violations"

      - name: Verify repository contains no tracked secret artifacts
        run: |
          tracked_secrets=$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(config\.properties|\.env(\..*)?|secrets/.*|[^/]+\.(p12|pfx|jks|keystore|pem|key|crt))$' || true)
          unexpected_secrets=$(printf '%s\n' "$tracked_secrets" | grep -Fxv 'src/test/resources/config.properties' || true)
          test -z "$unexpected_secrets"

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify release version matches project
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION=$(mvn --batch-mode --no-transfer-progress -q -DforceStdout help:evaluate -Dexpression=project.version)
          TEST_VERSION="${RELEASE_VERSION#v}"
          test "$PROJECT_VERSION" = "$TEST_VERSION"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Generate software bill of materials
        run: |
          mvn --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=chatapp-sbom
          test -s target/chatapp-sbom.json

      - name: Verify release SBOM
        env:
          PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom = json.loads(Path("target/chatapp-sbom.json").read_text(encoding="utf-8"))
          metadata = sbom.get("metadata", {})
          component = metadata.get("component", {})
          if sbom.get("bomFormat") != "CycloneDX":
              raise SystemExit("SBOM is not a CycloneDX document")
          if not sbom.get("specVersion"):
              raise SystemExit("SBOM is missing specVersion")
          if component.get("name") != "realtime-chat-app":
              raise SystemExit(f"unexpected SBOM component name: {component.get('name')!r}")
          if component.get("version") != os.environ["PROJECT_VERSION"]:
              raise SystemExit(f"unexpected SBOM project version: {component.get('version')!r}")
          if not metadata.get("timestamp"):
              raise SystemExit("SBOM is missing metadata timestamp")
          if not sbom.get("components"):
              raise SystemExit("SBOM contains no dependency components")
          PY

      - name: Verify runnable server package
        run: |
          test -s target/chatapp-server.jar
          unzip -p target/chatapp-server.jar META-INF/MANIFEST.MF | grep -Fxq 'Main-Class: com.chatapp.server.ChatServer'

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cp target/chatapp-server.jar "chatapp-server-${RELEASE_VERSION}.jar"
          cp target/chatapp-sbom.json "chatapp-server-${RELEASE_VERSION}.sbom.json"
          sha256sum "chatapp-server-${RELEASE_VERSION}.jar" > "chatapp-server-${RELEASE_VERSION}.jar.sha256"
          sha256sum --check "chatapp-server-${RELEASE_VERSION}.jar.sha256"

      - name: Attest release server artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: chatapp-server-${{ github.ref_name }}.jar

      - name: Attest release SBOM
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: chatapp-server-${{ github.ref_name }}.sbom.json

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build release container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_SHA_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build --pull \
            --build-arg APP_VERSION="$PROJECT_VERSION" \
            --build-arg VCS_REF="${{ github.sha }}" \
            --tag "${IMAGE_NAME}:${RELEASE_VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${IMAGE_SHA_TAG}" .

      - name: Scan release container image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # immutable commit; Trivy v0.74.0 update
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library

      - name: Verify release image metadata and hardening
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{index .Config.Labels \"org.opencontainers.image.source\"}}')" = "https://github.com/hack2ai/realtime-chat-app"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{index .Config.Labels \"org.opencontainers.image.description\"}}')" = "Secure Java 21 real-time chat server"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{index .Config.Labels \"org.opencontainers.image.licenses\"}}')" = "MIT"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{index .Config.Labels \"org.opencontainers.image.version\"}}')" = "$PROJECT_VERSION"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}')" = "${{ github.sha }}"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Config.User}}')" = "chatapp"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.Entrypoint}}')" = '["java","-XX:+ExitOnOutOfMemoryError","-jar","/app/chatapp-server.jar"]'
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.ExposedPorts}}')" = '{"5050/tcp":{}}'
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Config.StopSignal}}')" = "SIGTERM"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.Healthcheck.Test}}')" = '["CMD-SHELL","test -f /tmp/chatapp.ready || exit 1"]'
          image_env=$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.Env}}')
          if printf '%s' "$image_env" | grep -Eq 'CHATAPP_(DB_PASSWORD|MYSQL_ROOT_PASSWORD|AUTH_.*(PASSWORD|SECRET|TOKEN))'; then
            echo "application secret-like environment variable found in release image metadata"
            exit 1
          fi

      - name: Verify release image filesystem permissions
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker run --rm --entrypoint sh "${IMAGE_NAME}:${RELEASE_VERSION}" -c 'test "$(id -u)" = "10001" && test "$(stat -c %a /app/data/attachments)" = "700" && test -w /app/data/attachments && ! test -w /app && ! test -w /app/chatapp-server.jar'

      - name: Verify release image contains no private-key artifacts
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker run --rm --entrypoint sh "${IMAGE_NAME}:${RELEASE_VERSION}" -c 'test -z "$(find /app -xdev -type f \( -name "*.p12" -o -name "*.pfx" -o -name "*.jks" -o -name "*.keystore" -o -name "*.pem" -o -name "*.key" -o -name "*.crt" \) -print 2>/dev/null)"'

      - name: Verify release image has no setuid/setgid application files
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test -z "$(docker run --rm --entrypoint sh "${IMAGE_NAME}:${RELEASE_VERSION}" -c 'find /app -xdev -type f -perm /6000 -print 2>/dev/null')"

      - name: Verify release image Java runtime
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker run --rm --entrypoint java "${IMAGE_NAME}:${RELEASE_VERSION}" -version

      - name: Verify release image runs as non-root
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Config.User}}')" = "chatapp"

      - name: Push release container
        id: push-release-container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_SHA_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker push "${IMAGE_NAME}:${RELEASE_VERSION}" | tee /tmp/release-push.log
          DIGEST=$(awk '/digest:/ {print $2}' /tmp/release-push.log | tail -n 1)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${IMAGE_SHA_TAG}"

      - name: Verify published release digest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_SHA_TAG: sha-${{ github.sha }}
          PUBLISHED_DIGEST: ${{ steps.push-release-container.outputs.digest }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          REMOTE_DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Manifest.Digest}}')
          LATEST_DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}')
          SHA_TAG_DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_SHA_TAG}" --format '{{.Manifest.Digest}}')
          test "$REMOTE_DIGEST" = "$PUBLISHED_DIGEST"
          test "$LATEST_DIGEST" = "$PUBLISHED_DIGEST"
          test "$SHA_TAG_DIGEST" = "$PUBLISHED_DIGEST"

      - name: Attest release container
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push-release-container.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "chatapp-server-${RELEASE_VERSION}.jar" \
            "chatapp-server-${RELEASE_VERSION}.jar.sha256" \
            "chatapp-server-${RELEASE_VERSION}.sbom.json" \
            --title "$RELEASE_VERSION" \
            --generate-notes

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/release-assets
          gh release download "$RELEASE_VERSION" \
            --pattern "chatapp-server-${RELEASE_VERSION}.jar" \
            --pattern "chatapp-server-${RELEASE_VERSION}.jar.sha256" \
            --pattern "chatapp-server-${RELEASE_VERSION}.sbom.json" \
            --dir /tmp/release-assets \
            --clobber
          cd /tmp/release-assets
          sha256sum --check "chatapp-server-${RELEASE_VERSION}.jar.sha256"
          test -s "chatapp-server-${RELEASE_VERSION}.sbom.json"
