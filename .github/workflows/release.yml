name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify runnable server package
        run: |
          test -s target/chatapp-server.jar
          unzip -p target/chatapp-server.jar META-INF/MANIFEST.MF | grep -Eq '^Main-Class: com\.chatapp\.server\.ChatServer[[:space:]]*$'

      - name: Verify generated SBOM
        run: |
          test -s target/bom.json
          jq -e '.bomFormat == "CycloneDX" and (.specVersion | type == "string")' target/bom.json >/dev/null

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cp target/chatapp-server.jar "chatapp-server-${RELEASE_VERSION}.jar"
          cp target/bom.json "chatapp-sbom-${RELEASE_VERSION}.json"
          sha256sum "chatapp-server-${RELEASE_VERSION}.jar" > "chatapp-server-${RELEASE_VERSION}.jar.sha256"
          sha256sum "chatapp-sbom-${RELEASE_VERSION}.json" > "chatapp-sbom-${RELEASE_VERSION}.json.sha256"
          sha256sum --check "chatapp-server-${RELEASE_VERSION}.jar.sha256"
          sha256sum --check "chatapp-sbom-${RELEASE_VERSION}.json.sha256"

      - name: Attest release server artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "chatapp-server-${{ github.ref_name }}.jar"

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build release container image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build --pull \
            --build-arg VCS_REF="${{ github.sha }}" \
            --build-arg VERSION="${RELEASE_VERSION}" \
            --tag "${IMAGE_NAME}:${RELEASE_VERSION}" \
            --tag "${IMAGE_NAME}:latest" .

      - name: Verify release image metadata
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          image="${IMAGE_NAME}:${RELEASE_VERSION}"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/hack2ai/realtime-chat-app"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "MIT"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${{ github.sha }}"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${RELEASE_VERSION}"

      - name: Verify release image runs as non-root
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Config.User}}')" = "chatapp"
          test "$(docker run --rm --entrypoint id "${IMAGE_NAME}:${RELEASE_VERSION}" -u)" = "10001"

      - name: Verify release image entrypoint
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.Entrypoint}}')" = '["java","-jar","/app/chatapp-server.jar"]'

      - name: Verify release image port
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.ExposedPorts}}')" = '{"5050/tcp":{}}'

      - name: Verify release image healthcheck
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.Healthcheck.Test}}')" = '["CMD-SHELL","test -f /tmp/chatapp.ready"]'

      - name: Verify release image stop signal
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Config.StopSignal}}')" = "SIGTERM"

      - name: Verify release image filesystem policy
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          image="${IMAGE_NAME}:${RELEASE_VERSION}"
          test "$(docker image inspect "$image" --format '{{.Config.WorkingDir}}')" = "/app"
          test "$(docker image inspect "$image" --format '{{json .Config.Volumes}}')" = '{"/app/data/attachments":{}}'

      - name: Push release container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker push "${IMAGE_NAME}:${RELEASE_VERSION}"
          docker push "${IMAGE_NAME}:latest"

      - name: Attest release container provenance
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          image="${IMAGE_NAME}:${RELEASE_VERSION}"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | sed 's/^.*@//')
          test -n "$digest"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Publish release container provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Prepare container digest asset
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          printf 'ghcr.io/%s@%s\n' "${{ github.repository }}" "${IMAGE_DIGEST}" > "chatapp-container-${RELEASE_VERSION}.digest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "chatapp-server-${RELEASE_VERSION}.jar" \
            "chatapp-server-${RELEASE_VERSION}.jar.sha256" \
            "chatapp-sbom-${RELEASE_VERSION}.json" \
            "chatapp-sbom-${RELEASE_VERSION}.json.sha256" \
            "chatapp-container-${RELEASE_VERSION}.digest" \
            --title "$RELEASE_VERSION" \
            --generate-notes
