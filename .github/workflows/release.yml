name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify runnable server package
        run: |
          test -s target/chatapp-server.jar
          unzip -p target/chatapp-server.jar META-INF/MANIFEST.MF | grep -Eq '^Main-Class: com\.chatapp\.server\.ChatServer[[:space:]]*$'

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cp target/chatapp-server.jar "chatapp-server-${RELEASE_VERSION}.jar"
          sha256sum "chatapp-server-${RELEASE_VERSION}.jar" > "chatapp-server-${RELEASE_VERSION}.jar.sha256"
          sha256sum --check "chatapp-server-${RELEASE_VERSION}.jar.sha256"

      - name: Attest release server artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: chatapp-server-${{ github.ref_name }}.jar

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build release container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_SHA_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build --pull \
            --tag "${IMAGE_NAME}:${RELEASE_VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${IMAGE_SHA_TAG}" .

      - name: Verify release image hardening
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Config.User}}')" = "chatapp"
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.Entrypoint}}')" = '["java","-jar","/app/chatapp-server.jar"]'
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.ExposedPorts}}')" = '{"5050/tcp":{}}'
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Config.Healthcheck.Test}}')" = '["CMD-SHELL","test -f /tmp/chatapp.ready || exit 1"]'

      - name: Verify release image Java runtime
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker run --rm --entrypoint java "${IMAGE_NAME}:${RELEASE_VERSION}" -version

      - name: Push release container
        id: push-release-container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE_SHA_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker push "${IMAGE_NAME}:${RELEASE_VERSION}" | tee /tmp/release-push.log
          DIGEST=$(awk '/digest:/ {print $2}' /tmp/release-push.log | tail -n 1)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${IMAGE_SHA_TAG}"

      - name: Attest release container
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push-release-container.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "chatapp-server-${RELEASE_VERSION}.jar" \
            "chatapp-server-${RELEASE_VERSION}.jar.sha256" \
            --title "$RELEASE_VERSION" \
            --generate-notes
