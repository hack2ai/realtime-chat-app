name: Secret Material Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-material-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan tracked files for private keys
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -nEI -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- . ':!*.md' ':!*.txt' || true)
          if [[ -n "$matches" ]]; then
            echo 'Private-key material must not be committed to the repository:'
            printf '%s\n' "$matches"
            exit 1
          fi
