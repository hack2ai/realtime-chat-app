name: Secret Material Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-material-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files for private keys and common tokens
        shell: bash
        run: |
          set -euo pipefail

          private_keys=$(git grep -nEI -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- . ':!*.md' ':!*.txt' || true)
          if [[ -n "$private_keys" ]]; then
            echo 'Private-key material must not be committed to the repository:'
            printf '%s\n' "$private_keys"
            exit 1
          fi

          token_patterns='AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35}|sk_(live|test)_[A-Za-z0-9]{16,}|sk-proj-[A-Za-z0-9_-]{40,}|npm_[A-Za-z0-9]{36}|SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'
          tokens=$(git grep -nEI -- "$token_patterns" -- . ':!*.md' ':!*.txt' || true)
          if [[ -n "$tokens" ]]; then
            echo 'Known cloud/API token formats must not be committed to the repository:'
            printf '%s\n' "$tokens"
            exit 1
          fi
