name: Container Smoke

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Validate Docker Compose configuration
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: smoke-root-password
          CHATAPP_DB_PASSWORD: smoke-app-password
        run: docker compose config --quiet

      - name: Build server image
        run: |
          docker build --pull \
            --build-arg VCS_REF="${{ github.sha }}" \
            --build-arg VERSION="scheduled-smoke" \
            --tag realtime-chat-app:smoke .

      - name: Verify server image security contract
        run: |
          test "$(docker image inspect realtime-chat-app:smoke --format '{{.Config.User}}')" = "chatapp"
          test "$(docker run --rm --entrypoint id realtime-chat-app:smoke -u)" = "10001"
          test "$(docker image inspect realtime-chat-app:smoke --format '{{json .Config.Entrypoint}}')" = '["java","-jar","/app/chatapp-server.jar"]'
          test "$(docker image inspect realtime-chat-app:smoke --format '{{json .Config.ExposedPorts}}')" = '{"5050/tcp":{}}'

      - name: Start Compose stack
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: smoke-root-password
          CHATAPP_DB_PASSWORD: smoke-app-password
        run: docker compose up -d --build

      - name: Wait for healthy services
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: smoke-root-password
          CHATAPP_DB_PASSWORD: smoke-app-password
        run: |
          for attempt in {1..30}; do
            statuses=$(docker compose ps --format json)
            db_status=$(printf '%s\n' "$statuses" | jq -r 'select(.Service == "db") | .Health // "unknown"')
            server_status=$(printf '%s\n' "$statuses" | jq -r 'select(.Service == "server") | .Health // "unknown"')
            if [ "$db_status" = "healthy" ] && [ "$server_status" = "healthy" ]; then
              exit 0
            fi
            sleep 4
          done
          docker compose ps
          docker compose logs --no-color server db
          exit 1

      - name: Verify runtime hardening
        run: |
          container_id=$(docker compose ps -q server)
          test -n "$container_id"
          test "$(docker compose exec -T server id -u)" = "10001"
          docker inspect "$container_id" | jq -e '.[0].HostConfig.ReadonlyRootfs == true' >/dev/null
          docker inspect "$container_id" | jq -e '.[0].HostConfig.CapDrop == ["ALL"]' >/dev/null
          docker inspect "$container_id" | jq -e '.[0].HostConfig.SecurityOpt | index("no-new-privileges:true") != null' >/dev/null

      - name: Verify server TCP port
        run: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5050'

      - name: Smoke test framed PING/PONG
        run: |
          python3 - <<'PY'
          import json
          import socket
          import struct
          import time

          request = json.dumps({
              "type": "PING",
              "payload": None,
              "timestamp": int(time.time() * 1000),
          }, separators=(",", ":")).encode("utf-8")

          with socket.create_connection(("127.0.0.1", 5050), timeout=5) as sock:
              sock.sendall(struct.pack(">i", len(request)) + request)
              header = sock.recv(4)
              if len(header) != 4:
                  raise SystemExit("incomplete response header")
              length = struct.unpack(">i", header)[0]
              if length <= 0 or length > 8 * 1024 * 1024:
                  raise SystemExit(f"invalid response frame length: {length}")
              response = b""
              while len(response) < length:
                  chunk = sock.recv(length - len(response))
                  if not chunk:
                      raise SystemExit("server closed before the response was complete")
                  response += chunk

          payload = json.loads(response.decode("utf-8"))
          if payload.get("type") != "PONG":
              raise SystemExit(f"unexpected response type: {payload.get('type')!r}")
          PY

      - name: Show logs on failure
        if: failure()
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: smoke-root-password
          CHATAPP_DB_PASSWORD: smoke-app-password
        run: docker compose logs --no-color server db

      - name: Cleanup
        if: always()
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: smoke-root-password
          CHATAPP_DB_PASSWORD: smoke-app-password
        run: docker compose down --volumes --remove-orphans
