name: Docker Context Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required Docker ignore rules
        run: |
          required_patterns=(
            '.git'
            '.github'
            'target'
            '/data'
            '*.log'
            '.env'
            '.env.*'
            'config.properties'
            '*.p12'
            '*.pfx'
            '*.jks'
            '*.key'
            '*.pem'
          )
          for pattern in "${required_patterns[@]}"; do
            if ! grep -Fqx "$pattern" .dockerignore; then
              echo "Missing required .dockerignore exclusion: $pattern"
              exit 1
            fi
          done
