name: SBOM Attestation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: sbom-attestation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  attest-sbom:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download CI package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chatapp-server-${{ github.event.workflow_run.head_sha }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify SBOM checksum
        run: |
          test -s release-assets/chatapp-sbom.json
          test -s release-assets/chatapp-sbom.json.sha256
          cd release-assets
          sha256sum --check chatapp-sbom.json.sha256

      - name: Attest SBOM
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/chatapp-sbom.json
