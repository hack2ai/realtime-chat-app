name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # verified action revision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan high-confidence secret signatures
        shell: bash
        run: |
          set -euo pipefail

          key_header='-----BEGIN '"'"'PRIVATE KEY-----'"'"''
          aws_prefix='AKI'"'"'A'"'"''
          github_prefix='gh'"'"'p_'"'"''
          slack_prefix='xox'"'"'-'"'"''

          patterns=(
            "$key_header"
            "${aws_prefix}[0-9A-Z]{16}"
            "${github_prefix}[A-Za-z0-9_]{36}"
            "${slack_prefix}[A-Za-z0-9-]+"
          )

          found=0
          for pattern in "${patterns[@]}"; do
            matches=$(git grep -nI -E -- "$pattern" -- . ':!.github/workflows/secret-scan.yml' || true)
            if [ -n "$matches" ]; then
              printf '%s\n' "$matches"
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            echo 'High-confidence secret material was found in tracked files.'
            exit 1
          fi
