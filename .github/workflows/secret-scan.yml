name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked files for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan high-confidence secret signatures
        shell: bash
        run: |
          set -euo pipefail

          key_header='-----BEGIN '"'"'PRIVATE KEY-----'"'"''
          aws_prefix='AKI'"'"'A'"'"''
          github_prefix='gh'"'"'p_'"'"''
          slack_prefix='xox'"'"'-'"'"''

          patterns=(
            "$key_header"
            "${aws_prefix}[0-9A-Z]{16}"
            "${github_prefix}[A-Za-z0-9_]{36}"
            "${slack_prefix}[A-Za-z0-9-]+"
          )

          found=0
          for pattern in "${patterns[@]}"; do
            matches=$(git grep -nI -E -- "$pattern" -- . ':!.github/workflows/secret-scan.yml' || true)
            if [ -n "$matches" ]; then
              printf '%s\n' "$matches"
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            echo 'High-confidence secret material was found in tracked files.'
            exit 1
          fi
