name: Release Container Scan

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: release-container-scan-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan published release image
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify immutable workflow actions
        run: |
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull published release image
        env:
          RELEASE_VERSION: ${{ github.event.workflow_run.head_branch }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker pull "${IMAGE_NAME}:${RELEASE_VERSION}"

      - name: Scan published release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          RELEASE_VERSION: ${{ github.event.workflow_run.head_branch }}
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ env.RELEASE_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,misconfig,secret
          exit-code: '1'
