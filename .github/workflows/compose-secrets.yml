name: Compose Secret Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: docker compose config --quiet

      - name: Enforce Docker secret file usage
        env:
          CHATAPP_MYSQL_ROOT_PASSWORD: ci-root-password
          CHATAPP_DB_PASSWORD: ci-app-password
        run: |
          set -eu

          config=$(docker compose config --format json)

          printf '%s\n' "$config" | jq -e '.secrets.mysql_root_password.environment == "CHATAPP_MYSQL_ROOT_PASSWORD"' >/dev/null
          printf '%s\n' "$config" | jq -e '.secrets.db_password.environment == "CHATAPP_DB_PASSWORD"' >/dev/null

          printf '%s\n' "$config" | jq -e '.services.db.environment.MYSQL_ROOT_PASSWORD_FILE == "/run/secrets/mysql_root_password"' >/dev/null
          printf '%s\n' "$config" | jq -e '.services.db.environment.MYSQL_PASSWORD_FILE == "/run/secrets/db_password"' >/dev/null
          printf '%s\n' "$config" | jq -e '.services.server.environment.CHATAPP_DB_PASSWORD_FILE == "/run/secrets/db_password"' >/dev/null

          printf '%s\n' "$config" | jq -e '(.services.db.environment | has("MYSQL_ROOT_PASSWORD")) | not' >/dev/null
          printf '%s\n' "$config" | jq -e '(.services.db.environment | has("MYSQL_PASSWORD")) | not' >/dev/null
          printf '%s\n' "$config" | jq -e '(.services.server.environment | has("CHATAPP_DB_PASSWORD")) | not' >/dev/null

          grep -Fq 'environment: CHATAPP_MYSQL_ROOT_PASSWORD' docker-compose.yml
          grep -Fq 'environment: CHATAPP_DB_PASSWORD' docker-compose.yml
