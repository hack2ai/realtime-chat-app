name: Compose Secret Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enforce Docker secret file usage
        run: |
          set -eu

          grep -Fq 'MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password' docker-compose.yml
          grep -Fq 'MYSQL_PASSWORD_FILE: /run/secrets/db_password' docker-compose.yml
          grep -Fq 'CHATAPP_DB_PASSWORD_FILE: /run/secrets/db_password' docker-compose.yml

          grep -Fq 'mysql_root_password:' docker-compose.yml
          grep -Fq 'db_password:' docker-compose.yml
          grep -Fq 'environment: CHATAPP_MYSQL_ROOT_PASSWORD' docker-compose.yml
          grep -Fq 'environment: CHATAPP_DB_PASSWORD' docker-compose.yml

          if grep -nE '^[[:space:]]+(MYSQL_ROOT_PASSWORD|MYSQL_PASSWORD|CHATAPP_DB_PASSWORD):[[:space:]]' docker-compose.yml; then
            echo 'Plain-text database credentials must not be configured as Compose environment values.'
            exit 1
          fi

          if grep -nE '^[[:space:]]+secrets:[[:space:]]*$' docker-compose.yml >/dev/null; then
            :
          else
            echo 'Compose secret definitions are required.'
            exit 1
          fi
