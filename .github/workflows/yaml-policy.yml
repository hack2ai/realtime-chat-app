name: YAML Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaml-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate YAML syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable workflow actions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInP '^\s*uses:\s*[^@#\s]+@(?![0-9a-fA-F]{40}\b)[^#\s]+' .github/workflows; then
            echo 'All GitHub Actions must be pinned to a 40-character commit SHA.'
            exit 1
          fi

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            files = %x{git ls-files "*.yml" "*.yaml" docker-compose.yml}.lines.map(&:chomp).uniq
            abort "No YAML files found" if files.empty?
            files.each do |path|
              YAML.safe_load(File.read(path), aliases: true)
              puts "valid: #{path}"
            rescue Psych::SyntaxError => e
              warn "invalid YAML: #{path}"
              warn e.full_message
              exit 1
            end
          '
