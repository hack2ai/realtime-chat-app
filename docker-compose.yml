services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    environment:
      MYSQL_ROOT_PASSWORD: ${CHATAPP_MYSQL_ROOT_PASSWORD:?set CHATAPP_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: chatapp_db
      MYSQL_USER: chatapp_user
      MYSQL_PASSWORD: ${CHATAPP_DB_PASSWORD:?set CHATAPP_DB_PASSWORD}
    volumes:
      - chatapp-mysql:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: .
    restart: unless-stopped
    networks:
      - backend
    init: true
    read_only: true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 10s
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHATAPP_DB_HOST: db
      CHATAPP_DB_PORT: 3306
      CHATAPP_DB_NAME: chatapp_db
      CHATAPP_DB_USER: chatapp_user
      CHATAPP_DB_PASSWORD: ${CHATAPP_DB_PASSWORD:?set CHATAPP_DB_PASSWORD}
      CHATAPP_DB_POOL_MINIDLE: 2
      CHATAPP_DB_POOL_MAXSIZE: 10
      CHATAPP_DB_POOL_CONNECTIONTIMEOUTMS: 5000
      CHATAPP_DB_USESSL: "false"
      CHATAPP_DB_ALLOWPUBLICKEYRETRIEVAL: "false"
      CHATAPP_SERVER_PORT: 5050
      CHATAPP_SERVER_BINDADDRESS: 0.0.0.0
      CHATAPP_SERVER_MAXCLIENTS: 200
      CHATAPP_SERVER_SOCKETREADTIMEOUTMS: 120000
      CHATAPP_AUTH_BCRYPT_STRENGTH: 12
      CHATAPP_AUTH_SESSION_EXPIRYHOURS: 24
      CHATAPP_ATTACHMENTS_STORAGEPATH: /app/data/attachments
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/chatapp.ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "${CHATAPP_PUBLISH_ADDRESS:-127.0.0.1}:5050:5050"
    volumes:
      - chatapp-attachments:/app/data/attachments
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    internal: true

volumes:
  chatapp-mysql:
  chatapp-attachments:
