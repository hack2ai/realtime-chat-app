services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: chatapp_db
      MYSQL_USER: chatapp_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - mysql_root_password
      - db_password
    volumes:
      - chatapp-mysql:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/db_password)\" mysqladmin ping -h 127.0.0.1 -u chatapp_user --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: .
    restart: unless-stopped
    networks:
      - backend
    user: "10001"
    init: true
    read_only: true
    pids_limit: 256
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    stop_grace_period: 10s
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHATAPP_DB_HOST: db
      CHATAPP_DB_PORT: 3306
      CHATAPP_DB_NAME: chatapp_db
      CHATAPP_DB_USER: chatapp_user
      CHATAPP_DB_PASSWORD_FILE: /run/secrets/db_password
      CHATAPP_DB_POOL_MINIDLE: 2
      CHATAPP_DB_POOL_MAXSIZE: 10
      CHATAPP_DB_POOL_CONNECTIONTIMEOUTMS: 5000
      CHATAPP_DB_CONNECTTIMEOUTMS: 10000
      CHATAPP_DB_SOCKETTIMEOUTMS: 120000
      CHATAPP_DB_USESSL: "false"
      CHATAPP_DB_ALLOWPUBLICKEYRETRIEVAL: "false"
      CHATAPP_SERVER_PORT: 5050
      CHATAPP_SERVER_BINDADDRESS: 0.0.0.0
      # This demo stack publishes only to localhost; plaintext remote clients remain disabled.
      CHATAPP_SERVER_ALLOWPLAINTEXTREMOTE: "false"
      CHATAPP_SERVER_MAXCLIENTS: 200
      CHATAPP_SERVER_SOCKETREADTIMEOUTMS: 30000
      CHATAPP_AUTH_BCRYPT_STRENGTH: 12
      CHATAPP_AUTH_SESSION_EXPIRYHOURS: 24
      CHATAPP_ATTACHMENTS_STORAGEPATH: /app/data/attachments
    secrets:
      - db_password
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/chatapp-server.jar", "com.chatapp.server.ServerHealthCheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "${CHATAPP_PUBLISH_ADDRESS:-127.0.0.1}:5050:5050"
    volumes:
      - chatapp-attachments:/app/data/attachments
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    internal: true

secrets:
  mysql_root_password:
    environment: CHATAPP_MYSQL_ROOT_PASSWORD
  db_password:
    environment: CHATAPP_DB_PASSWORD

volumes:
  chatapp-mysql:
  chatapp-attachments:
